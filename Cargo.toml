# gdx-rust-sdk-examples — feat/v2 (MM distribution)
#
# Self-contained darkpool trading examples. The `godark` SDK is vendored
# under `sdk/` (Rust source with pre-generated protobuf bindings already
# committed under `sdk/src/generated/`), so building this repository
# requires only the standard Rust toolchain plus the public crates
# referenced below — no private registry, no `protoc`, no extra system
# dependencies.

[package]
name = "gdx-rust-sdk-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "Two MM-facing darkpool trading examples for the GoDark Rust SDK."
license = "MIT"

# Cargo's auto-discovery would otherwise try to compile the shared
# `examples/dotenv.rs` helper as its own example binary; the two real
# examples are listed explicitly in the `[[example]]` blocks below.
autoexamples = false

[dependencies]
# Vendored SDK source (see `sdk/`).
godark = { path = "sdk" }

# Async runtime + dotenv loader used by both examples.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
dotenvy = "0.15"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "full_trader_example"
path = "examples/full_trader_example.rs"

[[example]]
name = "spline_order_example"
path = "examples/spline_order_example.rs"
